name: Check patent key
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_keys.py
        env:
          PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
      - run: |
          git config user.name "research-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/key_check.log
          git diff --cached --quiet || git commit -m "Patent key check"
          git pull --rebase && git push
