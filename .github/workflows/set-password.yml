# Applies the SITE_PASSWORD secret to the pages' password screen (cosmetic: the data files stay public).
name: Set site password
on: workflow_dispatch
permissions:
  contents: write
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/gate.py
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - run: |
          git config user.name "research-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/gate.json
          git diff --cached --quiet || git commit -m "Update site password"
          git pull --rebase && git push
